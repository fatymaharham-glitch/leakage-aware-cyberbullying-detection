input_data: data/processed/experiment_ready.csv
grouped_fold_assignments: data/splits/leakage_aware_folds.csv
random_fold_assignments: data/splits/non_final_random_folds.csv
text_column: tweet_text
label_column: cyberbullying_type
row_id_column: row_id
group_column: near_duplicate_group_id
fold_column: fold
final_test_fold: 0
cross_validation_folds: [1, 2, 3, 4]
preprocessing: p1
representation:
  combined:
    word:
      analyzer: word
      ngram_range: [1, 2]
      min_df: 2
      max_df: 0.95
      max_features: 60000
    character:
      analyzer: char_wb
      ngram_range: [3, 5]
      min_df: 2
      max_df: 0.95
      max_features: 60000
model:
  logistic_regression_balanced:
    estimator: logistic_regression
    C: 1.0
    max_iter: 1000
    class_weight: balanced
outputs:
  directory: reports/model_results/leakage_gap
