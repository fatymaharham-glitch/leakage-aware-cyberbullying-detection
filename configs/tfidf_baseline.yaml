input_data: data/processed/experiment_ready.csv
fold_assignments: data/splits/leakage_aware_folds.csv
text_column: tweet_text
label_column: cyberbullying_type
row_id_column: row_id
fold_column: fold
final_test_fold: 0
cross_validation_folds:
  - 1
  - 2
  - 3
  - 4
preprocessing_pipelines:
  - p0
  - p1
  - p2
tfidf:
  analyzer: word
  ngram_range:
    - 1
    - 2
  min_df: 2
  max_df: 0.95
  max_features: 100000
  sublinear_tf: true
models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: null
  linear_svm:
    C: 1.0
    max_iter: 10000
    class_weight: null
outputs:
  directory: reports/model_results/tfidf_preprocessing_baseline
