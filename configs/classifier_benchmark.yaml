input_data: data/processed/experiment_ready.csv
fold_assignments: data/splits/leakage_aware_folds.csv
text_column: tweet_text
label_column: cyberbullying_type
row_id_column: row_id
fold_column: fold
final_test_fold: 0
cross_validation_folds: [1, 2, 3, 4]
preprocessing: p1
representations:
  combined:
    word:
      analyzer: word
      ngram_range: [1, 2]
      min_df: 2
      max_df: 0.95
      max_features: 60000
    character:
      analyzer: char_wb
      ngram_range: [3, 5]
      min_df: 2
      max_df: 0.95
      max_features: 60000
models:
  multinomial_nb:
    estimator: multinomial_nb
    alpha: 1.0
  logistic_regression_c0_5:
    estimator: logistic_regression
    C: 0.5
    max_iter: 1000
    class_weight: null
  logistic_regression_c1:
    estimator: logistic_regression
    C: 1.0
    max_iter: 1000
    class_weight: null
  logistic_regression_c2:
    estimator: logistic_regression
    C: 2.0
    max_iter: 1000
    class_weight: null
  logistic_regression_c1_balanced:
    estimator: logistic_regression
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  linear_svm_c0_5:
    estimator: linear_svm
    C: 0.5
    max_iter: 10000
    class_weight: null
  linear_svm_c1:
    estimator: linear_svm
    C: 1.0
    max_iter: 10000
    class_weight: null
  linear_svm_c2:
    estimator: linear_svm
    C: 2.0
    max_iter: 10000
    class_weight: null
  linear_svm_c1_balanced:
    estimator: linear_svm
    C: 1.0
    max_iter: 10000
    class_weight: balanced
  random_forest:
    estimator: random_forest
    n_estimators: 75
    max_depth: 30
    max_features: sqrt
    class_weight: null
    n_jobs: 4
  xgboost:
    estimator: xgboost
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.5
    n_jobs: 4
outputs:
  directory: reports/model_results/classifier_benchmark
