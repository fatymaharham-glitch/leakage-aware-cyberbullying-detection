<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leakage-aware cyberbullying classification research interface.">
  <link rel="icon" href="data:,">
  <title>Cyberbullying Classification — Research Interface</title>
  <style>
    :root {
      color-scheme: light;
      --black: #0a0a0a;
      --ink: #1b1b1b;
      --muted: #686868;
      --line: #d7d7d7;
      --soft: #f4f4f4;
      --white: #fff;
      --space-1: .375rem;
      --space-2: .75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--white); }
    body { margin: 0; color: var(--ink); background: var(--white); font-size: 14px; }
    button, textarea, select { font: inherit; }
    button, select, textarea { border-radius: 0; }
    :focus-visible { outline: 2px solid var(--black); outline-offset: 3px; }
    .skip { position: fixed; inset-block-start: -4rem; inset-inline-start: 1rem; z-index: 20; padding: .75rem 1rem; color: var(--white); background: var(--black); }
    .skip:focus { inset-block-start: 1rem; }
    .shell { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; display: flex; width: 236px; flex-direction: column; padding: var(--space-4); color: var(--white); background: var(--black); }
    .identity { padding-block-end: var(--space-4); border-block-end: 1px solid #383838; }
    .identity-mark { display: grid; width: 38px; height: 38px; place-items: center; margin-block-end: var(--space-3); border: 1px solid var(--white); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .identity strong { display: block; font-size: 14px; line-height: 1.35; }
    .identity span { display: block; margin-block-start: .3rem; color: #a9a9a9; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .navigation { display: grid; gap: var(--space-1); margin-block-start: var(--space-4); }
    .navigation button { width: 100%; padding: .7rem .8rem; border: 1px solid transparent; color: #aaa; background: transparent; text-align: start; cursor: pointer; }
    .navigation button:hover { color: var(--white); }
    .navigation button[aria-current="page"] { border-color: #555; color: var(--white); background: #202020; }
    .sidebar-note { margin-block-start: auto; padding-block-start: var(--space-4); border-block-start: 1px solid #383838; color: #aaa; font-size: 11px; line-height: 1.55; }
    .workspace { min-width: 0; margin-inline-start: 236px; }
    .topbar { position: sticky; inset-block-start: 0; z-index: 8; display: flex; min-height: 58px; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem var(--space-5); border-block-end: 1px solid var(--line); background: #fffffff2; backdrop-filter: blur(8px); }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .system-status { display: inline-flex; align-items: center; gap: .5rem; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .system-status::before { width: 7px; height: 7px; border-radius: 50%; background: var(--black); content: ""; }
    main { max-width: 1240px; margin-inline: auto; padding: 2.5rem var(--space-5) 4rem; }
    .panel[hidden] { display: none; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 2rem; margin-block-end: 2rem; padding-block-end: 1.5rem; border-block-end: 1px solid var(--black); }
    .kicker { margin: 0 0 .55rem; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-block-start: 0; }
    h1 { max-width: 780px; margin-block-end: .8rem; font-size: clamp(1.8rem, 4vw, 3.1rem); line-height: 1.02; letter-spacing: -.045em; }
    h2 { margin-block-end: .4rem; font-size: 1.4rem; letter-spacing: -.025em; }
    h3 { margin-block-end: .5rem; font-size: .9rem; }
    .lede { max-width: 760px; margin-block-end: 0; color: var(--muted); line-height: 1.65; }
    .tag { padding: .45rem .65rem; border: 1px solid var(--black); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    .grid { display: grid; gap: var(--space-3); }
    .metrics { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-block-end: var(--space-5); }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { min-width: 0; padding: var(--space-4); border: 1px solid var(--line); background: var(--white); }
    .card-label { display: block; min-height: 2.2em; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; line-height: 1.35; text-transform: uppercase; }
    .metric-value { display: block; margin-block: .7rem .3rem; font: 600 1.65rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.05em; }
    .metric-note { color: var(--muted); font-size: 11px; }
    .notice { margin-block-end: var(--space-5); padding: 1rem 1.1rem; border-inline-start: 4px solid var(--black); background: var(--soft); line-height: 1.55; }
    .section-title { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 2rem 0 1rem; }
    .section-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .classifier { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); padding: 0; }
    .classifier-input, .classifier-output { min-width: 0; padding: var(--space-4); }
    .classifier-output { border-inline-start: 1px solid var(--line); background: var(--soft); }
    label { display: block; margin-block-end: .45rem; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    select, textarea { width: 100%; border: 1px solid #aaa; color: var(--ink); background: var(--white); }
    select { min-height: 42px; padding: .65rem .75rem; }
    textarea { min-height: 154px; padding: .8rem; line-height: 1.55; resize: vertical; }
    .field { margin-block-end: var(--space-3); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .sample-label { margin-block: 1.25rem .6rem; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .sample-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
    .sample { min-height: 40px; padding: .55rem .65rem; border: 1px solid #aaa; color: var(--ink); background: var(--white); text-align: start; cursor: pointer; }
    .sample:hover { border-color: var(--black); background: var(--soft); }
    .counter { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .primary-action { min-height: 42px; padding: .65rem 1rem; border: 1px solid var(--black); color: var(--white); background: var(--black); font-weight: 700; cursor: pointer; }
    .primary-action:hover { color: var(--black); background: var(--white); }
    .primary-action:disabled { cursor: wait; opacity: .5; }
    .result-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .result-category { margin-block: .8rem 1.25rem; font-size: 1.45rem; font-weight: 700; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .datum { display: flex; justify-content: space-between; gap: 1rem; padding-block: .65rem; border-block-start: 1px solid var(--line); }
    .datum span { color: var(--muted); }
    .datum strong { text-align: end; }
    .result-message { margin: 1rem 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .model-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2); }
    .model-item { padding: 1rem; border-block-start: 2px solid var(--black); background: var(--soft); }
    .model-item strong { display: block; margin-block: .55rem; font: 600 1.1rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .model-item p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .stage { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: var(--space-4); padding: 1.25rem 0; border-block-start: 1px solid var(--line); }
    .stage-code { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
    .stage p { margin-block-end: .5rem; color: var(--muted); line-height: 1.55; }
    .stage b { color: var(--ink); }
    .experiment-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
    .experiment-index { position: sticky; inset-block-start: 76px; display: grid; border: 1px solid var(--line); }
    .experiment-index button { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: .6rem; align-items: center; min-height: 58px; padding: .7rem; border: 0; border-block-end: 1px solid var(--line); color: var(--muted); background: var(--white); text-align: start; cursor: pointer; }
    .experiment-index button:last-child { border-block-end: 0; }
    .experiment-index button[aria-selected="true"] { color: var(--white); background: var(--black); }
    .experiment-number { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .experiment-name { overflow: hidden; font-size: 11px; font-weight: 700; text-overflow: ellipsis; }
    .experiment-detail { min-width: 0; }
    .detail-head { padding: var(--space-4); color: var(--white); background: var(--black); }
    .detail-head h2 { margin-block-end: .75rem; }
    .detail-head p { margin-block-end: 0; color: #c7c7c7; line-height: 1.55; }
    .detail-block { padding: var(--space-4); border: 1px solid var(--line); border-block-start: 0; }
    .detail-block h3 { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .detail-block ul { margin: 0; padding-inline-start: 1.2rem; }
    .detail-block li { margin-block: .45rem; line-height: 1.5; }
    .detail-figure { margin-block-start: var(--space-3); }
    .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: .7rem .75rem; border-block-end: 1px solid var(--line); text-align: start; white-space: nowrap; }
    th { border-block-end: 2px solid var(--black); color: var(--ink); background: #e8e8e8; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    tbody tr:nth-child(even) { background: var(--soft); }
    td:last-child, th:last-child { text-align: end; }
    .bar-row { display: grid; grid-template-columns: minmax(120px, 1fr) 1.5fr 58px; gap: .7rem; align-items: center; margin-block: .65rem; font-size: 11px; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 8px; background: #e2e2e2; }
    .bar-fill { height: 100%; background: var(--black); }
    .bar-value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-align: end; }
    figure { margin: 0; border: 1px solid var(--line); }
    figure img { display: block; width: 100%; aspect-ratio: 14 / 9; object-fit: contain; background: var(--white); }
    figcaption { padding: .75rem 1rem; border-block-start: 1px solid var(--line); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .limitations { margin: 0; padding-inline-start: 1.2rem; }
    .limitations li { padding: .6rem 0; border-block-end: 1px solid var(--line); line-height: 1.55; }
    .loading { padding: 3rem 0; color: var(--muted); }
    footer { margin-block-start: 3rem; padding-block-start: 1.25rem; border-block-start: 1px solid var(--black); color: var(--muted); font-size: 11px; }
    @media (max-width: 980px) {
      .sidebar { width: 190px; }
      .workspace { margin-inline-start: 190px; }
      .metrics, .model-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .classifier { grid-template-columns: 1fr; }
      .classifier-output { border-block-start: 1px solid var(--line); border-inline-start: 0; }
      .experiment-layout { grid-template-columns: 200px minmax(0, 1fr); }
    }
    @media (max-width: 680px) {
      .sidebar { position: static; width: auto; padding: 1rem; }
      .identity { display: flex; align-items: center; gap: .8rem; padding-block-end: 1rem; }
      .identity-mark { flex: 0 0 auto; margin: 0; }
      .navigation { grid-template-columns: repeat(2, 1fr); margin-block-start: 1rem; }
      .navigation button { min-height: 44px; padding: .55rem; text-align: center; }
      .sidebar-note { display: none; }
      .workspace { margin: 0; }
      .topbar { padding-inline: 1rem; }
      main { padding: 1.5rem 1rem 3rem; }
      .page-head { align-items: start; flex-direction: column; gap: 1rem; }
      .metrics, .two, .three, .model-list { grid-template-columns: 1fr; }
      .stage { grid-template-columns: 1fr; gap: .5rem; }
      .experiment-layout { grid-template-columns: 1fr; }
      .experiment-index { position: static; grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .experiment-index button { display: block; min-height: 48px; border-block-end: 0; border-inline-end: 1px solid var(--line); text-align: center; }
      .experiment-name { display: none; }
      .sample-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 390px) {
      .navigation { grid-template-columns: repeat(2, 1fr); }
      .topbar { align-items: start; flex-direction: column; }
      .bar-row { grid-template-columns: minmax(85px, 1fr) 1fr 48px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="identity"><div class="identity-mark">CB</div><div><strong>Cyberbullying<br>Classification</strong><span>Research interface</span></div></div>
      <nav class="navigation" aria-label="Research sections">
        <button type="button" data-panel="overview" aria-current="page">Overview</button>
        <button type="button" data-panel="classifier">Classifier</button>
        <button type="button" data-panel="experiments">Experiments</button>
        <button type="button" data-panel="limitations">Limitations</button>
      </nav>
      <p class="sidebar-note">Decision support only. Predictions require human interpretation and must not trigger automatic punishment.</p>
    </aside>
    <div class="workspace">
      <header class="topbar"><span class="breadcrumb">Research / Leakage-aware evaluation</span><span class="system-status">Evidence loaded</span></header>
      <main id="main"><div class="loading">Loading verified research evidence…</div></main>
    </div>
  </div>
  <script>
    const main = document.querySelector('#main');
    const navigation = [...document.querySelectorAll('[data-panel]')];
    const percent = value => `${(Number(value) * 100).toFixed(1)}%`;
    const clean = value => String(value).replaceAll('_', ' ');
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const describe = value => Array.isArray(value) ? value.join(', ') : Object.entries(value).map(([key, item]) => `${clean(key)}: ${Array.isArray(item) ? item.join(', ') : item}`).join(' · ');

    function bars(rows, valueKey = 'value', labelKey = 'label') {
      const maximum = Math.max(...rows.map(row => Number(row[valueKey])), .01);
      return rows.map(row => `<div class="bar-row"><span class="bar-label" title="${escapeHtml(row[labelKey])}">${escapeHtml(clean(row[labelKey]))}</span><span class="bar-track"><span class="bar-fill" style="width:${Number(row[valueKey]) / maximum * 100}%"></span></span><span class="bar-value">${percent(row[valueKey])}</span></div>`).join('');
    }

    function panel(id, content) { return `<section class="panel" data-content="${id}" ${id === 'overview' ? '' : 'hidden'}>${content}</section>`; }

    function table(headers, rows) {
      return `<div class="table-wrap"><table><thead><tr>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(value => `<td>${escapeHtml(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function experimentMetrics(item) {
      const detail = item.details;
      if (item.stage.endsWith('1')) return table(['Measure', 'Value'], [
        ['Raw rows', Number(detail.raw.rows).toLocaleString()], ['Prepared rows', Number(detail.prepared.rows).toLocaleString()],
        ['Conflicting-label groups', Number(detail.duplicate_audit.conflicting_label_groups).toLocaleString()],
        ['Protected fold rows', Number(detail.folds.row_counts['0']).toLocaleString()], ['Groups crossing folds', detail.folds.near_duplicate_groups_crossing_folds]
      ]);
      if (item.stage.endsWith('2')) {
        const rows = [...Object.entries(detail.preprocessing), ...Object.entries(detail.representations)].map(([name, value]) => [clean(name), percent(value.summary.macro_f1_mean), Number(value.summary.runtime_seconds).toFixed(1) + ' s']);
        return table(['Candidate', 'Macro-F1', 'Runtime'], rows);
      }
      if (item.stage.endsWith('3')) {
        const rows = Object.entries(detail.headline_models).map(([name, value]) => [clean(name), percent(value)]);
        rows.push(['Selected primary', clean(detail.selection.primary)], ['Selected backup', clean(detail.selection.backup)]);
        return table(['Candidate / decision', 'Result'], rows);
      }
      if (item.stage.endsWith('4')) {
        const rows = Object.entries(detail.robustness).flatMap(([model, conditions]) => Object.entries(conditions).map(([condition, value]) => [`${clean(model)} · ${clean(condition)}`, percent(value.macro_f1)]));
        rows.push(['Bootstrap difference', percent(detail.bootstrap_primary_minus_backup.difference)], ['Bootstrap 95% interval', `${percent(detail.bootstrap_primary_minus_backup.low)} to ${percent(detail.bootstrap_primary_minus_backup.high)}`]);
        return table(['Review measure', 'Result'], rows);
      }
      return table(['Final measure', 'Result'], [
        ['Rows', Number(detail.metrics.rows).toLocaleString()], ['Macro-F1', percent(detail.metrics.macro_f1)], ['Accuracy', percent(detail.metrics.accuracy)],
        ['Balanced accuracy', percent(detail.metrics.balanced_accuracy)], ['MCC', Number(detail.metrics.mcc).toFixed(3)], ['Referral rate', percent(detail.metrics.referred_rate)]
      ]);
    }

    function experimentDetail(item, index, evidence) {
      const source = clean(item.metadata.evidence_source || 'recorded evidence');
      return `<article><div class="detail-head"><p class="kicker">${escapeHtml(item.stage)} · ${escapeHtml(source)}</p><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.why)}</p></div><div class="detail-block"><h3>Compared</h3><p>${escapeHtml(describe(item.settings))}</p><h3>Decision</h3><p>${escapeHtml(item.result)}</p></div><div class="detail-block"><h3>Detailed results</h3>${experimentMetrics(item)}</div><div class="detail-block"><h3>Limitations</h3><ul>${item.limitations.map(value => `<li>${escapeHtml(value)}</li>`).join('')}</ul></div><figure class="detail-figure"><a href="${evidence[index].url}" target="_blank" rel="noopener"><img src="${evidence[index].url}" alt="${escapeHtml(item.title)} result figure" width="1400" height="900"></a><figcaption>${escapeHtml(item.stage)} result figure</figcaption></figure></article>`;
    }

    function render(data) {
      const headline = data.headline;
      main.innerHTML = `${panel('overview', `
        <div class="page-head"><div><p class="kicker">Complete research prototype</p><h1>Leakage-aware tweet classification.</h1><p class="lede">Six-class text classification with protected grouped evaluation, reproducible evidence, and explicit human-review boundaries.</p></div><span class="tag">Fold 0 protected</span></div>
        <div class="notice"><strong>Interpretation boundary.</strong> One tweet cannot establish intent, repetition, power imbalance, real-world harm, or a complete cyberbullying event.</div>
        <div class="grid metrics">
          <article class="card"><span class="card-label">Final macro-F1</span><strong class="metric-value">${percent(headline.macro_f1)}</strong><span class="metric-note">Protected fold</span></article>
          <article class="card"><span class="card-label">Accuracy</span><strong class="metric-value">${percent(headline.accuracy)}</strong><span class="metric-note">All classes</span></article>
          <article class="card"><span class="card-label">Balanced accuracy</span><strong class="metric-value">${percent(headline.balanced_accuracy)}</strong><span class="metric-note">Mean class recall</span></article>
          <article class="card"><span class="card-label">MCC</span><strong class="metric-value">${headline.mcc.toFixed(3)}</strong><span class="metric-note">Overall quality</span></article>
          <article class="card"><span class="card-label">Human referral</span><strong class="metric-value">${percent(headline.human_review_rate)}</strong><span class="metric-note">Below 45%</span></article>
        </div>
        <div class="section-title"><div><p class="kicker">Model registry</p><h2>Saved inference pipelines</h2></div><p>Weights and fitted vectorizers are checksum-verified at startup.</p></div>
        <div class="model-list">${data.models.map(model => `<article class="model-item"><span class="card-label">${escapeHtml(model.name)}${model.selected ? ' · selected' : ''}</span><strong>${percent(model.macro_f1)}</strong><p>${escapeHtml(model.note)}</p></article>`).join('')}</div>`)}
        ${panel('classifier', `
        <div class="page-head"><div><p class="kicker">Inference workspace</p><h1>Classify one tweet.</h1><p class="lede">Choose any saved pipeline. Input is processed locally and is not stored by this application.</p></div><span class="tag">5 fitted models</span></div>
        <div class="card classifier">
          <div class="classifier-input"><div class="field"><label for="model-select">Inference model</label><select id="model-select">${data.models.map(model => `<option value="${model.id}" ${model.selected ? 'selected' : ''}>${escapeHtml(model.name)} — ${percent(model.macro_f1)}</option>`).join('')}</select></div><div class="field"><label for="tweet">Tweet text</label><textarea id="tweet" maxlength="500" placeholder="Enter text for classification" spellcheck="true"></textarea></div><div class="actions"><span class="counter"><span id="count">0</span> / 500 · ⌘/Ctrl + Enter</span><button class="primary-action" id="predict" type="button">Run classification</button></div><p class="sample-label">Synthetic one-click examples</p><div class="sample-grid"><button class="sample" type="button" data-sample="The project meeting starts at three tomorrow.">Neutral statement</button><button class="sample" type="button" data-sample="You are too old to understand anything.">Age-targeted insult</button><button class="sample" type="button" data-sample="People from that religion do not belong here.">Religion-targeted abuse</button></div></div>
          <div class="classifier-output" id="prediction" aria-live="polite"><span class="result-label">Awaiting input</span><p class="result-message">Category, confidence, and review guidance appear here.</p></div>
        </div>`)}
        ${panel('experiments', `
        <div class="page-head"><div><p class="kicker">Research workflow</p><h1>Five controlled experiments.</h1><p class="lede">Each stage records its decision, evidence, limitations, and reproducible command.</p></div><span class="tag">Complete</span></div>
        <div class="experiment-layout"><div class="experiment-index" role="tablist" aria-label="Select experiment">${data.experiments.map((item, index) => `<button type="button" role="tab" data-experiment="${index}" aria-selected="${index === 0}"><span class="experiment-number">0${index + 1}</span><span class="experiment-name">${escapeHtml(item.title)}</span></button>`).join('')}</div><div class="experiment-detail" id="experiment-detail" role="tabpanel">${experimentDetail(data.experiments[0], 0, data.evidence)}</div></div>`)}
        ${panel('limitations', `
        <div class="page-head"><div><p class="kicker">Responsible use</p><h1>Known limitations.</h1><p class="lede">These boundaries are part of the result and should travel with every prediction.</p></div><span class="tag">Human decision required</span></div>
        <article class="card"><ul class="limitations">${data.limitations.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul></article>
        <div class="section-title"><div><p class="kicker">External transfer</p><h2>Domain-shift warning</h2></div></div><div class="grid three"><article class="card"><span class="card-label">External accuracy</span><strong class="metric-value">${percent(data.safety.external.accuracy)}</strong></article><article class="card"><span class="card-label">Harmful recall</span><strong class="metric-value">${percent(data.safety.external.harmful_recall)}</strong></article><article class="card"><span class="card-label">False-positive rate</span><strong class="metric-value">${percent(data.safety.external.false_positive_rate)}</strong></article></div>`)}
        <footer>Local research interface · Five checksum-verified pipelines · Human interpretation required</footer>`;
      bindNavigation();
      bindClassifier();
      bindExperiments(data);
    }

    function bindNavigation() {
      const panels = [...document.querySelectorAll('[data-content]')];
      function activate(id, updateHash = true) {
        const selected = panels.some(panel => panel.dataset.content === id) ? id : 'overview';
        panels.forEach(panel => panel.hidden = panel.dataset.content !== selected);
        navigation.forEach(button => button.setAttribute('aria-current', button.dataset.panel === selected ? 'page' : 'false'));
        if (updateHash) history.replaceState(null, '', `#${selected}`);
        document.querySelector(`[data-content="${selected}"] h1`)?.focus({preventScroll: true});
        window.scrollTo(0, 0);
      }
      navigation.forEach(button => button.addEventListener('click', () => activate(button.dataset.panel)));
      activate(location.hash.slice(1), false);
    }

    function bindClassifier() {
      const input = document.querySelector('#tweet');
      const button = document.querySelector('#predict');
      const output = document.querySelector('#prediction');
      const count = document.querySelector('#count');
      const model = document.querySelector('#model-select');
      input.addEventListener('input', () => count.textContent = input.value.length);
      input.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); button.click(); } });
      button.addEventListener('click', async () => {
        button.disabled = true;
        output.innerHTML = '<span class="result-label">Processing</span><p class="result-message">Running the selected fitted pipeline…</p>';
        try {
          const response = await fetch('/predict', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: input.value, model: model.value})});
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Classification failed.');
          output.innerHTML = `<span class="result-label">${escapeHtml(result.model_name)}</span><div class="result-category">${escapeHtml(clean(result.category))}</div><div class="datum"><span>${escapeHtml(clean(result.confidence_kind))}</span><strong>${percent(result.confidence)}</strong></div><div class="datum"><span>Human review</span><strong>${result.needs_human_review ? 'Required' : 'Recommended'}</strong></div><p class="result-message">${escapeHtml(result.message)}</p>`;
        } catch (error) { output.innerHTML = `<span class="result-label">Unable to classify</span><p class="result-message">${escapeHtml(error.message)}</p>`; }
        finally { button.disabled = false; }
      });
      document.querySelectorAll('[data-sample]').forEach(sample => sample.addEventListener('click', () => { input.value = sample.dataset.sample; count.textContent = input.value.length; button.click(); }));
    }

    function bindExperiments(data) {
      const buttons = [...document.querySelectorAll('[data-experiment]')];
      const detail = document.querySelector('#experiment-detail');
      buttons.forEach(button => button.addEventListener('click', () => {
        const index = Number(button.dataset.experiment);
        buttons.forEach(item => item.setAttribute('aria-selected', String(item === button)));
        detail.innerHTML = experimentDetail(data.experiments[index], index, data.evidence);
      }));
    }

    fetch('/project').then(response => { if (!response.ok) throw new Error('Verified evidence could not be loaded.'); return response.json(); }).then(render).catch(error => { main.innerHTML = `<div class="loading">${escapeHtml(error.message)}</div>`; });
  </script>
</body>
</html>
